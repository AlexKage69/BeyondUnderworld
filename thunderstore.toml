[config]
schemaVersion = "0.0.1"

[package]
namespace = "AlexKage"
name = "BeyondUnderworld"
versionNumber = "0.0.1"
description = "Hades 2 Mod adding new content such as, Weapons, Mechanics, Biome and Story."
websiteUrl = "https://thunderstore.io"
containsNsfwContent = false
[package.dependencies]
NikkelM-Zagreus_Journey = "1.3.0"


[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./build"

[[build.copy]]
source = "./dist"
target = ""


[publish]
repository = "https://thunderstore.io"
communities = [ "hades2", ]
[publish.categories]
hades2 = [ "Mods", "Gameplay", ]


